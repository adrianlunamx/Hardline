// Hardline - valores para adv_options.ini (motor IW, Warzone 1 / MW2019).
// Solo se aplica si el juego ya generó el archivo. {{PHYSICAL_CORES}} se
// sustituye por los núcleos físicos detectados.
//
// RendererWorkerCount: hilos del render. Por defecto el juego usa
//   núcleos lógicos - 1 (11 en un 7600X). Con núcleos físicos (6) cada worker
//   tiene un núcleo entero: menos contención con SMT y 1% lows más estables.
// VideoMemoryScale: fracción de VRAM que el juego se permite usar. 0.85 deja
//   margen para Discord/overlays/navegador en 8 GB sin hacer streaming extra.
// ConfigCloudStorageEnabled: 0 = el juego no sobrescribe este archivo con la
//   copia en la nube de Activision.
[Graphics]
RendererWorkerCount = {{PHYSICAL_CORES}}
VideoMemoryScale = 0.85
ConfigCloudStorageEnabled = 0
ConfigCloudSavegameEnabled = 0
