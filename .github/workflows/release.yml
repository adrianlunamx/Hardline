name: validate-and-release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Release creada desde la web de GitHub: también adjunta el ZIP + SHA256.
  release:
    types: [published]
  # Reempaquetar una versión a mano (Actions > validate-and-release > Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ej. v1.2.0). Si no existe, se crea sobre main.'
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7

      # "shell" no admite expresiones (${{ matrix.shell }}): un paso por shell.
      - name: Tests (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/validate.ps1

      - name: Tests (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/validate.ps1

      - name: PSScriptAnalyzer (errores)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($issues) { exit 1 }

      - name: DryRun de detección
        shell: powershell
        if: matrix.shell == 'powershell'
        run: |
          . .\src\core\common.ps1
          . .\src\core\detector.ps1
          Initialize-HLSession -Root $PWD -DryRun -Unattended
          $hw = Get-HLHardware
          Show-HLHardware -Hw $hw

      # WPF solo existe en Windows: aquí se comprueba que la ventana se construye
      # de verdad (sin mostrarla) y que todos sus controles existen.
      - name: GUI (carga del XAML)
        shell: powershell
        if: matrix.shell == 'powershell'
        run: |
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
          $ns = 'http://schemas.microsoft.com/winfx/2006/xaml'
          foreach ($f in @('main.xaml', 'guide.xaml', 'eq_panel.xaml')) {
            [xml]$x = Get-Content (Join-Path .\src\gui $f) -Raw -Encoding UTF8
            $w = [Windows.Markup.XamlReader]::Load((New-Object System.Xml.XmlNodeReader $x))
            $names = $x.SelectNodes('//*[@*[local-name()="Name"]][not(ancestor::*[local-name()="ControlTemplate"])]') | ForEach-Object { $_.GetAttribute('Name', $ns) } | Where-Object { $_ }
            $missing = @($names | Where-Object { -not $w.FindName($_) })
            if ($missing) { throw "${f}: controles no encontrados: $($missing -join ', ')" }
            Write-Host "${f}: ventana construida, $($names.Count) controles"
          }

  release:
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    # Una release creada en la web dispara "push" del tag y "release": que no corran a la vez.
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Empaquetar
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          zip -r "dist/hardline-${VERSION}.zip" . \
            -x '.git/*' '.github/*' 'dist/*' \
               'backups/*' 'reports/*' 'logs/*'
          # Directorios de runtime vacíos
          zip "dist/hardline-${VERSION}.zip" backups/.gitkeep reports/.gitkeep logs/.gitkeep
          (cd dist && sha256sum "hardline-${VERSION}.zip" > "hardline-${VERSION}.zip.sha256")

      - name: Notas de la versión desde CHANGELOG
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "Hardline ${TAG}" > dist/notes.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Hardline ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: dist/notes.md
          files: |
            dist/hardline-*.zip
            dist/hardline-*.zip.sha256
